<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 520px;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 3rem;
    }
    p {
      margin: 0 0 24px;
      line-height: 1.5;
      color: #555;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      background: #0077cc;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
    }
    a:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Sorry, the page you are looking for could not be found.</p>
    <a href="index.html">Return Home</a>
  </div>
</body>
</html>
